<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">TEAM PROJECT</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">Add tasks, track your work, and stay organised.</p>
    </header>

    <form id="task-form" class="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="Enter a task..." maxlength="100" required>
      <button type="submit">Add Task</button>
    </form>

    <section class="summary" aria-live="polite">
      <span id="task-count">0 tasks</span>
      <button id="clear-completed" class="text-button" type="button">Clear completed</button>
    </section>

    <ul id="task-list" class="task-list">
      <li class="empty-state">No tasks yet. Add your first task above!</li>
    </ul>
    <footer>Simple To-Do List · HTML, CSS and JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
